    <h1>Contact me!</h1>
    <section class="two-col">

        <img src="/images/mail-person.png" alt="Jayden delivering the mail" style="max-width:260px;margin:1rem auto">
      </div>
      <form id="contact" action="https://formspree.io/f/mwlokbap" method="POST">
        <label for="email">Email</label><input id="email" name="email" type="email" required>
        <label for="subject">Subject</label><input id="subject" name="subject">
        <label for="message">Message</label><textarea id="message" name="message" required></textarea>
        <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
        <button class="btn solid" type="submit">Submit</button>
        <p class="form-status" aria-live="polite"></p>
      </form>
    </section>
